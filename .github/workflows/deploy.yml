name: Deploy Apex Shoes API to EC2

on:
  push:
    branches:
      - apex-shoes/api

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Executing remote ssh commands using ssh-action
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # 1. Navigate to the folder
            cd ~/apex-shoes-api || exit
            
            # 2. Pull the latest code
            git pull origin apex-shoes/api
            
            # 3. Install dependencies
            npm install --production
            
            # 4. Restart or Start the app using PM2
            # This checks if the process exists; if not, it starts a new one
            pm2 describe apex-shoes-api > /dev/null 2>&1
            if [ $? -ne 0 ]; then
              pm2 start src/index.js --name apex-shoes-api
            else
              pm2 restart apex-shoes-api
            fi
            
            # 5. Save PM2 state so it restarts on server reboot
            pm2 save